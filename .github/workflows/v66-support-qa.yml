name: V66 private staging support inbox integration (NO DEPLOY)
on:
  push:
    branches: [fix/v66-staging-support-inbox-20261118]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cnc-v66-support-qa
  cancel-in-progress: false
jobs:
  isolated-support:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and existing isolated D1 security tests
        run: npm run lint && npm test
      - name: Build staging frontend and bundle backend
        run: npm run build && npm run bundle:worker
      - name: Test connected ticket, order, role and admin MFA workflows in disposable D1
        run: node scripts/v58-marketplace-e2e.mjs
      - name: Package verified Worker and frontend on immutable artifact branch (NO DEPLOY)
        run: |
          test -f dist/index.html
          test -f dist/_worker.js
          JS_FILE=$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)
          CSS_FILE=$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' -print -quit)
          test -n "$JS_FILE" && test -n "$CSS_FILE"
          test -f "$JS_FILE" && test -f "$CSS_FILE"
          grep -Fq "/assets/$(basename "$JS_FILE")" dist/index.html
          grep -Fq "/assets/$(basename "$CSS_FILE")" dist/index.html
          cp dist/_worker.js dist/staging-v66-support-backend.mjs
          sha256sum dist/index.html "$JS_FILE" "$CSS_FILE" dist/staging-v66-support-backend.mjs > dist/staging-v66-support-manifest.sha256
          printf 'source=%s\\nscope=existing-private-staging-only\\nno-deploy\\n' "$GITHUB_SHA" > dist/staging-v66-support-source.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c artifact/staging-v66-support-20261118
          git add -f dist/index.html "$JS_FILE" "$CSS_FILE" dist/staging-v66-support-backend.mjs dist/staging-v66-support-manifest.sha256 dist/staging-v66-support-source.txt
          git commit -m "build(private staging): tested support inbox UI and Worker, no deployment"
          git push origin HEAD:refs/heads/artifact/staging-v66-support-20261118
      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-v66-support-inbox-isolated-evidence
          path: web/reports/
          if-no-files-found: warn
          retention-days: 14
