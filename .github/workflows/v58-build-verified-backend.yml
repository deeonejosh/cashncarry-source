name: Package v58 buyer-role security repair for private staging (NO DEPLOY)
on:
  push:
    branches: [fix/v58-marketplace-e2e]
    paths:
      - '.github/workflows/v58-build-verified-backend.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-verified-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript, existing D1 tests and connected marketplace E2E
        run: |
          npm run lint
          npm test
          node scripts/v58-marketplace-e2e.mjs
      - name: Validate unchanged approved staging frontend and bundle repaired backend
        run: |
          npm run build
          npm run bundle:worker
          echo 'd885970af9a34102f4a8d63b0f6d4b4bea90bd3c13b6d00c109fdcdac99c660c  dist/index.html' | sha256sum -c -
          echo '6595806be9b58806b6bf1b34d8c6dab88fd0f2864b14004884d39e36df68ae72  dist/assets/index-DjAQX0oY.js' | sha256sum -c -
          echo 'a25a7fb15bf5883b5152e0cb296a317feffaf4688c043e6a6ac51b9c68d51057  dist/assets/index-uvdl1fkh.css' | sha256sum -c -
          cp dist/_worker.js dist/staging-v58-e2e-backend.mjs
          sha256sum dist/staging-v58-e2e-backend.mjs > dist/staging-v58-e2e-backend.sha256
          printf 'source=%s\nscope=private-staging-backend-only\nno-production\nno-deploy\n' "$GITHUB_SHA" > dist/staging-v58-e2e-source.txt
      - name: Commit immutable backend file to a separate release artifact branch (NO DEPLOY)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c artifact/v58-marketplace-buyer-guard-20261118
          git add -f dist/staging-v58-e2e-backend.mjs dist/staging-v58-e2e-backend.sha256 dist/staging-v58-e2e-source.txt
          git commit -m "build(private staging): verified buyer-only order guard backend; no deployment"
          git push origin HEAD:refs/heads/artifact/v58-marketplace-buyer-guard-20261118
      - name: Upload immutable backend and E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-v58-e2e-buyer-guard-backend-release
          path: |
            web/dist/staging-v58-e2e-backend.mjs
            web/dist/staging-v58-e2e-backend.sha256
            web/dist/staging-v58-e2e-source.txt
            web/reports/v58-isolated-marketplace-e2e.json
          if-no-files-found: warn
          retention-days: 30
