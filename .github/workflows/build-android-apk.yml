name: Build Cash N Carry Android APK
on:
  push:
    branches:
      - feature/openai-chat-staging
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Android source ZIP stored in repository root"
        required: true
        default: "cash-n-carry-android-build-source.zip"
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        shell: bash
        env:
          SOURCE_ZIP: cash-n-carry-android-build-source.zip
        run: |
          set -euo pipefail
          case "$SOURCE_ZIP" in
            */*|*..*) echo "Source must be a ZIP in repository root"; exit 1 ;;
          esac
          test -f "$SOURCE_ZIP" || { echo "Upload $SOURCE_ZIP to this branch first"; exit 1; }
          mkdir -p android
          unzip -q "$SOURCE_ZIP" -d android
          test -f android/app/build.gradle.kts || { echo "Not an Android Gradle project"; exit 1; }
      - name: Apply Android authentication repair
        run: python3 deploy/android/patch-auth.py
      - name: Verify login and registration controls in compiled source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('android/app/src/main/java/com/example/ui/auth/AuthComponents.kt').read_text()
          required = {
              'email sign-in field': 'testTag("login_email")',
              'password sign-in field': 'testTag("login_password")',
              'email sign-in button': 'testTag("login_submit")',
              'email registration field': 'testTag("register_email")',
              'registration password field': 'testTag("register_password")',
              'registration button': 'testTag("register_submit")',
              'Firebase registration': 'createUserWithEmailAndPassword',
              'Firebase email login': 'signInWithEmailAndPassword',
              'Google Firebase credential': 'signInWithCredential',
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing authentication controls: ' + ', '.join(missing))
          print('Verified all nine authentication code markers in source used by APK')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || exit 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare Android environment template
        shell: bash
        env:
          CHAT_API_BASE_URL: https://cashncarry-new-staging.cashncarry-workforce-2026.workers.dev
        run: |
          set -euo pipefail
          if [ ! -f android/.env.example ]; then
            printf 'CHAT_API_BASE_URL=%s\n' "$CHAT_API_BASE_URL" > android/.env.example
          fi
          # Secrets Gradle Plugin generates BuildConfig.FLUTTERWAVE_PUBLIC_KEY
          # only when this property is present. Keep payments in sandbox mode.
          if ! grep -q '^FLUTTERWAVE_PUBLIC_KEY=' android/.env.example; then
            printf 'FLUTTERWAVE_PUBLIC_KEY=PLACEHOLDER_DISABLED\n' >> android/.env.example
          fi
      - name: Build debug APK
        working-directory: android
        env:
          CHAT_API_BASE_URL: https://cashncarry-new-staging.cashncarry-workforce-2026.workers.dev
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 3650
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cash-n-carry-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
