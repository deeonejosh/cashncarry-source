name: Diagnose missing Android verification input in staging UI test
on:
  push:
    branches: [feature/openai-chat-staging]
    paths: ['.github/workflows/repair-integrated-source-zip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture-auth-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add actionable Compose semantics failure diagnostics in integrated source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,zipfile
          src=Path('Cash-N-Carry-Staging-Upload-Under-25MB.zip')
          tmp=Path('Cash-N-Carry-Staging-Upload-Under-25MB.tmp.zip')
          target='app/src/test/java/com/example/ui/auth/AuthComponentsTest.kt'
          old='        composeRule.onNodeWithTag("verify_token_input", useUnmergedTree = true).assertExists()'
          new='\n'.join([
              '        try {',
              '            composeRule.onNodeWithTag("verify_token_input", useUnmergedTree = true).assertExists()',
              '        } catch (error: AssertionError) {',
              '            throw AssertionError("Verification input missing after transition. UI semantics tree: \\n" + composeRule.onRoot(useUnmergedTree = true).printToString(), error)',
              '        }'
          ])
          with zipfile.ZipFile(src) as zin,zipfile.ZipFile(tmp,'w') as zout:
            assert target in zin.namelist()
            for item in zin.infolist():
              data=zin.read(item.filename)
              if item.filename==target:
                s=data.decode('utf-8')
                assert s.count(old)==1
                s=s.replace(old,new,1)
                data=s.encode('utf-8')
              zout.writestr(item,data)
          with zipfile.ZipFile(tmp) as z:assert z.testzip() is None
          assert tmp.stat().st_size <25_000_000
          os.replace(tmp,src)
          PY
          mkdir -p verify
          unzip -q Cash-N-Carry-Staging-Upload-Under-25MB.zip -d verify
          python3 -m unittest discover -s verify/scripts -p 'test_*.py' -v
      - name: Commit diagnostic source to staging only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cash-N-Carry-Staging-Upload-Under-25MB.zip
          git diff --cached --quiet && exit 0
          git commit -m 'test(android): report Compose semantics when verification field is absent'
          git push origin HEAD:feature/openai-chat-staging
