name: Clean up Cloudflare Android Compose test imports (staging only)
on:
  push:
    branches: [feature/openai-chat-staging]
    paths: ['.github/workflows/repair-integrated-source-zip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-test-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incorrect Compose assertExists import from integrated Android source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          src = Path('Cash-N-Carry-Staging-Upload-Under-25MB.zip')
          dest = Path('Cash-N-Carry-Staging-Upload-Under-25MB.tmp.zip')
          target = 'app/src/test/java/com/example/ui/auth/AuthComponentsTest.kt'
          wrong = 'import androidx.compose.ui.test.assertExists\n'
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dest, 'w') as zout:
              assert target in zin.namelist()
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if item.filename == target:
                      body = data.decode('utf-8')
                      assert body.count(wrong) == 1, 'Expected one unnecessary assertExists import'
                      body = body.replace(wrong, '', 1)
                      assert 'composeRule.onNodeWithTag("login_password_length_hint", useUnmergedTree = true).assertExists()' in body
                      data = body.encode('utf-8')
                  zout.writestr(item, data)
          with zipfile.ZipFile(dest) as archive:
              assert archive.testzip() is None
          assert dest.stat().st_size < 25_000_000
          os.replace(dest, src)
          PY
          mkdir -p _verified
          unzip -q Cash-N-Carry-Staging-Upload-Under-25MB.zip -d _verified
          python3 -m unittest discover -s _verified/scripts -p 'test_*.py' -v
      - name: Commit corrected integrated source ZIP
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cash-N-Carry-Staging-Upload-Under-25MB.zip
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 0; }
          git commit -m 'test(android): remove incorrect assertExists import'
          git push origin HEAD:feature/openai-chat-staging
