name: V58 Android source QA and disposable staging debug APK (NO DEPLOY)
on:
  push:
    branches: [fix/v58-marketplace-e2e]
    paths: ['.github/workflows/v58-android-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CNC_API_BASE_URL: https://cashncarry-mobile-staging-api.cashncarry-workforce-2026.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Use preinstalled runner Android SDK (avoid obsolete Android tools package)
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
          echo "$sdk_dir/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install compile SDK 36.1 and build tools without paid services
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Recover missing build metadata from existing checked-in integrated source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path('Cash-N-Carry-Staging-Upload-Under-25MB.zip')
          assert archive.is_file(), 'Existing integrated Android source archive missing'
          required=('settings.gradle.kts','build.gradle.kts','gradle/libs.versions.toml')
          with ZipFile(archive) as z:
              names=z.namelist()
              for target in required:
                  dest=Path(target)
                  if dest.is_file() and dest.stat().st_size>0:
                      print('Existing build metadata kept:',target)
                      continue
                  matches=[n for n in names if not n.endswith('/') and (n==target or n.endswith('/'+target))]
                  # Prefer the root of the integrated project, rather than app/ or legacy nested exports
                  matches.sort(key=lambda n:(n.count('/'),len(n)))
                  if not matches:
                      raise SystemExit('No valid archived Gradle metadata: '+target)
                  data=z.read(matches[0])
                  if not data.strip():
                      raise SystemExit('Archived Gradle metadata is empty: '+target)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
                  print('Recovered build metadata for disposable CI workspace:',target,'bytes=',len(data))
          PY
      - name: Confirm Android build settings include the checked-out application source
        shell: bash
        run: |
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s gradle/libs.versions.toml
          grep -Fq 'include(":app")' settings.gradle.kts
          test -s app/build.gradle.kts
      - name: Create temporary staging-only debug signer
        run: bash scripts/create-staging-debug-keystore.sh
      - name: Android source unit tests and debug-only APK (not real-device acceptance)
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload local JVM test evidence and debug-only APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashncarry-v58-e2e-android-qa
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 14
