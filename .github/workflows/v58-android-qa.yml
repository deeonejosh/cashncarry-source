name: V58 Android source QA and disposable staging debug APK (NO DEPLOY)
on:
  push:
    branches: [fix/v58-marketplace-e2e]
    paths: ['.github/workflows/v58-android-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CNC_API_BASE_URL: https://cashncarry-mobile-staging-api.cashncarry-workforce-2026.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK 36.1 and build tools without paid services
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Create temporary staging-only debug signer
        run: bash scripts/create-staging-debug-keystore.sh
      - name: Android source unit tests and debug-only APK (not real-device acceptance)
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload local JVM test evidence and debug-only APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashncarry-v58-e2e-android-qa
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 14
