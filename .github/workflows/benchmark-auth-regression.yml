name: Cash N Carry owner-auth benchmark diagnosis
on:
  push:
    branches:
      - fix/staging-ai-benchmark-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-auth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run isolated Miniflare regression checks, without deployment
        run: npm test
