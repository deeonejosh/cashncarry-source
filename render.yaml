# Cash N Carry isolated free-tier staging, NOT www.cashncarryng.com.
# Secrets must be entered in Render, never committed. No local database or disk.
services:
  - type: web
    name: cashncarry-node-free-staging
    runtime: node
    region: frankfurt
    plan: free
    branch: feature/node-platform-phase1
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: cd server && npm install --omit=dev --no-audit --no-fund && cd ../web && npm ci --include=dev --legacy-peer-deps --no-audit --no-fund && npm run lint && npm run build
    startCommand: node server/src/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: staging
      - key: CNC_PRIVATE_STAGING
        value: "true"
      - key: CNC_API_BIND_HOST
        value: 0.0.0.0
      - key: CNC_NEON_DATABASE_URL
        sync: false
      - key: CNC_VIDEO_STORAGE_MODE
        value: disabled
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: COINS_PURCHASES_ENABLED
        value: "false"
      - key: KYC_UPLOADS_ENABLED
        value: "false"
      - key: FLW_MODE
        value: disabled
