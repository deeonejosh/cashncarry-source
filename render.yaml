# Cash N Carry NEW Node-platform isolated staging only.
# DO NOT use this Blueprint for cashncarryng.com or the old Cloudflare Worker.
services:
  - type: web
    name: cashncarry-node-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: feature/node-platform-phase1
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: cd web && npm ci --include=dev --legacy-peer-deps --no-audit --no-fund && npm run lint && npm run build
    startCommand: node server/src/server.mjs
    healthCheckPath: /api/health
    disk:
      name: cashncarry-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: staging
      - key: CNC_PRIVATE_STAGING
        value: "true"
      - key: CNC_API_BIND_HOST
        value: 0.0.0.0
      - key: CNC_DB_PATH
        value: /var/data/db/cashncarry.sqlite
      - key: CNC_VIDEO_STORAGE_DIR
        value: /var/data/videos
      - key: STATIC_DIST_DIR
        value: web/dist
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: COINS_PURCHASES_ENABLED
        value: "false"
      - key: KYC_UPLOADS_ENABLED
        value: "false"
      - key: FLW_MODE
        value: disabled
      # Optional server-only secrets below belong in the Render dashboard, not GitHub.
      # CLOUDFLARE_STREAM_ACCOUNT_ID
      # CLOUDFLARE_STREAM_API_TOKEN
      # AUTH_RESEND_API_KEY
      # AUTH_EMAIL_FROM
      # ADMIN_ACCOUNT_ID
      # ADMIN_TOTP_SECRET_HEX
